<!DOCTYPE html>
<html lang="en"> <!--lang='en' le informa qué lenguaje usamos al navegador-->
<head> <!--Sirve para configuraciones de la página-->
    <meta charset="UTF-8"> <!--Configura el enconding de texto-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Sirve para el 'responsive', es decir cómo responde la página al tamaño de la pantalla donde está siendo visualizada-->
    <title>Mi web</title>
</head>
<body> <!--Representa el cuerpo de la página, todo lo visible-->
    <h1 id="título">Hola mundo, esta es mi primera página web</h1>
    <h2>estoy aprendiendo</h2>
</body>
</html>
